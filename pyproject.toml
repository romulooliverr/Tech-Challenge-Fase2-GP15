[project]
name = "rotas"
version = "0.1.0"
description = "Tech Challenge Fase 2 — Projeto 2: otimização de rotas de medicamentos e insumos (VRP) com Algoritmo Genético + LLM (Gemini ou Ollama)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "folium>=0.17",
    "ortools>=9.10",
    "google-genai>=1.0",
    "ollama>=0.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "streamlit-folium>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "jupyter>=1.0", "nbconvert>=7.0"]
legacy = ["pygame>=2.5"]

[project.scripts]
rotas = "rotas.cli:main"

[tool.poetry]
packages = [{ include = "rotas", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]
